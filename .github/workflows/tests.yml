name: Python and agent setup checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Codex and Claude skill parity
        run: python tools/check_agent_setup.py
      - name: Run project tests
        run: python -m unittest discover -s tests -v
